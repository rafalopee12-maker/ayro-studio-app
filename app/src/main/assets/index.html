<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayro Studio Calculadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma tela. Cabeçalho preto com a marca, conteúdo rolável, navegação fixa embaixo.
   Um único tema escuro, o mesmo mundo visual do logo: preto, prata e azul elétrico. */
:root{
  color-scheme: dark;
  --bg:#05070b;
  --surface:#0e1219;
  --surface-2:#161c26;
  --line:#232b38;
  --text:#e9edf3;
  --muted:#8b96a8;
  --silver:#c9d0da;
  --accent:#1e7bff;
  --accent-soft:#12305e;
  --good:#35c98a;
  --bad:#ff5d5d;
  --font-display:"Michroma","Eurostile","Arial Black",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

header{background:#000;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
header img{width:44px;height:44px;display:block}
.brand{flex:1;min-width:0}
.brand b{font-family:var(--font-display);font-weight:400;font-size:15px;letter-spacing:.12em;display:block}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.sync{font-size:11px;color:var(--muted);text-align:right;line-height:1.25;max-width:92px}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px}
.sync.on i{background:var(--good)}

main{flex:1;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-weight:400;font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hint{font-size:13px;color:var(--muted);margin:0}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note p{margin:0;flex:1}
.note button{background:none;border:0;color:var(--silver);font-weight:600;padding:0 2px}

.group{display:flex;flex-direction:column;gap:12px}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.row.three{grid-template-columns:1fr 1fr 1fr}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.in{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:48px}
.in:focus-within{border-color:var(--accent)}
.in input,.in select{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;padding:0 12px;height:46px;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
.in select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.in select option{background:var(--surface);color:var(--text)}
.in em{font-style:normal;color:var(--muted);font-size:13px;padding:0 12px 0 0;white-space:nowrap}
.in em.pre{padding:0 0 0 12px}
.in input[type=color]{padding:4px;height:46px}

.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.acc li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-top:1px solid var(--line)}
.acc li:first-child{border-top:0}
ul{list-style:none;margin:0;padding:0}
.acc .n{flex:1;min-width:0}
.acc .n b{font-weight:500;display:block;overflow-wrap:anywhere}
.acc .n span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:2px}
.step button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;line-height:1}
.step output{width:30px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}

/* Etiqueta de preço: o canto cortado repete as facetas do cubo do logo */
.tag{background:linear-gradient(160deg,#141b27,#0b0f16);border:1px solid var(--line);padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);position:relative}
.tag::after{content:"";position:absolute;top:0;right:0;width:26px;height:26px;background:var(--accent);clip-path:polygon(0 0,100% 100%,0 100%)}
.tag .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.price{font-family:var(--font-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.two .gain b{color:var(--good)}
.two .loss b{color:var(--bad)}
.bar{display:flex;height:10px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;min-width:0}
.brk li{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.brk i{width:10px;height:10px;flex:none}
.brk span{flex:1}
.brk b{font-weight:500;font-variant-numeric:tabular-nums}
.c-mat{background:var(--accent)}.c-maq{background:var(--silver)}.c-acc{background:#6fb0ff}.c-per{background:#5a6475}.c-ext{background:#93a0b4}

.btn{min-height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:0 16px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.card > .item:first-child, .card > ul > li:first-child .item{border-top:0}
.item .n{flex:1;min-width:0}
.item .n b{font-weight:600;display:block;overflow-wrap:anywhere}
.item .n span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .v b{display:block;font-size:17px}
.item .v span{font-size:12px;color:var(--good)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.cathead{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.cathead b{flex:1;font-weight:600;overflow-wrap:anywhere}
.empty{padding:20px 12px;color:var(--muted);font-size:14px;text-align:center}
.count{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:20px;padding:2px 9px;font-variant-numeric:tabular-nums}
.logo-full{width:100%;max-width:320px;display:block;margin:0 auto}
textarea{width:100%;min-height:90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

nav{display:grid;grid-template-columns:repeat(5,1fr);background:#000;border-top:1px solid var(--line)}
nav button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--text);border-top-color:var(--accent)}
nav button[aria-current=page] svg{stroke:var(--accent)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);border-top:2px solid var(--accent);width:100%;max-width:560px;max-height:92%;overflow-y:auto;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--silver);color:#05070b;font-weight:600;font-size:14px;padding:10px 16px;border-radius:24px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (max-width:359px){.row.three{grid-template-columns:1fr 1fr}.price{font-size:28px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:16/10;background:var(--surface);border:1px dashed #3a4558;border-radius:var(--r);overflow:hidden;color:var(--muted);font-size:14px;cursor:pointer;text-align:center;padding:0}
.photo svg{width:34px;height:34px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.has{border-style:solid;border-color:var(--line)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.thumb{width:54px;height:54px;border-radius:8px;flex:none;object-fit:cover;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);color:var(--muted);font-size:16px}
.warn{color:#ffb454}
.linkbtn{background:none;border:0;color:#6fb0ff;padding:6px 0;font-weight:600;font-size:13px;text-align:left}
.preview{width:100%;display:block;border:1px solid var(--line)}
.item.static{cursor:default}
</style>
</head>

const brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=v=>brl.format(isFinite(v)?v:0);
const dec=(v,d=2)=>(isFinite(v)?v:0).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function num(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  let s=String(v??"").trim().replace(/[^\d.,-]/g,"");
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  const n=parseFloat(s); return isFinite(n)?n:0;
}
function fmtTime(hours){ const min=Math.round(hours*60); return min>=60?`${Math.floor(min/60)}h${String(min%60).padStart(2,"0")}`:`${min} min`; }

/* ---------- dados ---------- */
function seed(){
  const cores=[["Laranja","#ff7a1a"],["Vermelho","#e02b2b"],["Branco","#f4f4f4"],["Cinza","#8b9099"],["Roxo que muda de cor","#8a4be0"],["Preto","#1b1b1b"],["Azul","#1e6bff"],["Verde","#23a455"]];
  return {v:2,updated:0,
    settings:{hour:2.5,margin:100,loss:10,fee:0},
    filaments:cores.map((c,i)=>({id:"f"+(i+1),name:c[0],color:c[1],price:0,weight:1000})),
    categories:[],pieces:[],draft:null,
    quote:{client:"",days:"7",obs:"",items:[]},quoteSeq:1};
}
function normalize(s){
  const b=seed();
  if(!s||typeof s!=="object") return b;
  s.settings=Object.assign({},b.settings,s.settings||{});
  for(const k of ["filaments","categories","pieces"]) if(!Array.isArray(s[k])) s[k]=[];
  if((s.v||1)<2){ /* versão anterior: tira os exemplos prontos */
    s.pieces=s.pieces.filter(p=>p.id!=="p1"&&p.id!=="p2");
    s.categories=s.categories.filter(c=>!/^c[1-4]$/.test(c.id)||s.pieces.some(p=>p.catId===c.id));
    if(s.example) s.filaments.forEach(f=>{ if(/^f[1-8]$/.test(f.id)&&f.price===100) f.price=0; });
    s.draft=null; delete s.example; s.v=2;
  }
  s.categories.forEach(c=>{if(!Array.isArray(c.acc)) c.acc=[];});
  s.pieces.forEach(p=>{if(!p.acc||typeof p.acc!=="object") p.acc={}; p.saved=true;});
  s.quote=Object.assign({},b.quote,s.quote||{}); if(!Array.isArray(s.quote.items)) s.quote.items=[];
  s.quoteSeq=s.quoteSeq||1; s.updated=s.updated||0;
  return s;
}
let state;
try{ state=normalize(JSON.parse(localStorage.getItem(LS))); }catch(e){ state=seed(); }
let tab="calc", search="";

const fil=id=>state.filaments.find(f=>f.id===id);
const cat=id=>state.categories.find(c=>c.id===id);
const piece=id=>state.pieces.find(p=>p.id===id);
function defAcc(catId){const c=cat(catId),o={}; if(c) c.acc.forEach(a=>o[a.id]=a.def??1); return o;}
function blankDraft(){
  return {id:newId(),saved:false,name:"",catId:"",filId:state.filaments[0]?.id||"",grams:"",h:"",m:"",qty:"1",extra:"",margin:dec(state.settings.margin),acc:{}};
}
if(!state.draft||!state.draft.id) state.draft=blankDraft();

/* fotos: guardadas fora do estado principal, uma por produto */
const photos={};
try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(PH)) photos[k.slice(PH.length)]=localStorage.getItem(k); } }catch(e){}
let fotosCol=null;
function setPhoto(id,data){
  photos[id]=data;
  try{ localStorage.setItem(PH+id,data); }catch(e){ toast("Sem espaço no aparelho para guardar mais fotos."); }
  if(fotosCol) fotosCol.doc(id).set({d:data}).catch(()=>{});
}
function delPhoto(id){
  delete photos[id];
  try{ localStorage.removeItem(PH+id); }catch(e){}
  if(fotosCol) fotosCol.doc(id).delete().catch(()=>{});
}
function loadImg(src){ return new Promise(res=>{ if(!src) return res(null); const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
async function pickPhoto(file){
  const url=URL.createObjectURL(file); const img=await loadImg(url); URL.revokeObjectURL(url);
  if(!img){ toast("Não consegui abrir essa imagem. Tente outra foto."); return; }
  const max=560, k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  setPhoto(state.draft.id,c.toDataURL("image/jpeg",0.72)); render();
}

function compute(p){
  const s=state.settings, f=fil(p.filId), c=cat(p.catId);
  const qty=Math.max(1,num(p.qty)||1);
  const mat=f&&f.weight>0? num(p.grams)/qty*f.price/f.weight : 0;
  const hours=(num(p.h)+num(p.m)/60)/qty;
  const maq=hours*s.hour;
  const per=(mat+maq)*s.loss/100;
  let acc=0; if(c) c.acc.forEach(a=>{acc+=a.price*(p.acc?.[a.id]||0);});
  const ext=num(p.extra);
  const custo=mat+maq+per+acc+ext;
  const fee=Math.min(Math.max(s.fee,0),95);
  const preco=custo*(1+num(p.margin)/100)/(1-fee/100);
  const taxa=preco*fee/100;
  return {mat,maq,per,acc,ext,custo,preco,taxa,lucro:preco-taxa-custo,hours,grams:num(p.grams)/qty,noFil:!f,noPrice:!!f&&!(f.price>0)};
}

/* ---------- salvar: aparelho + conta ---------- */
function saveLocal(){ try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){} }
let docRef=null,writing=false,dirty=false,timer=null;
function commit(){ state.updated=Date.now(); saveLocal(); if(docRef){clearTimeout(timer); timer=setTimeout(push,900);} }
async function push(){
  if(!docRef) return;
  if(writing){dirty=true;return;}
  writing=true; dirty=false;
  try{ await docRef.set({updated:state.updated,json:JSON.stringify(state)}); setSync(true); }
  catch(e){ setSync(false); }
  writing=false; if(dirty) push();
}
function setSync(on){ const el=$("#sync"); el.classList.toggle("on",on); el.querySelector("span").textContent=on?"Salvo na sua conta":"Salvo neste aparelho"; }
let downloads=null;
async function initCloud(){
  if(!window.claude||!window.claude.use) return;
  window.claude.use("downloads").then(d=>{downloads=d;}).catch(()=>{});
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc("data/users/"+id+"/estado");
    const snap=await ref.get();
    docRef=ref;
    if(snap.exists){
      const d=snap.data()||{};
      if((d.updated||0)>state.updated&&d.json){
        const draft=state.draft; state=normalize(JSON.parse(d.json)); state.draft=draft;
        saveLocal(); render();
      }else if(state.updated>(d.updated||0)) push();
    }else if(state.updated>0) push();
    setSync(true);
    fotosCol=ref.collection("fotos");
    const qs=await fotosCol.get(); const inCloud={}; let got=false;
    qs.docs.forEach(doc=>{ inCloud[doc.id]=1; const v=doc.data(); if(!photos[doc.id]&&v&&v.d&&(piece(doc.id)||doc.id===state.draft.id)){ photos[doc.id]=v.d; try{localStorage.setItem(PH+doc.id,v.d);}catch(e){} got=true; } });
    for(const k of Object.keys(photos)) if(!inCloud[k]&&piece(k)){ try{ await fotosCol.doc(k).set({d:photos[k]}); }catch(e){} }
    if(got) render();
  }catch(e){ if(!docRef) setSync(false); }
}

/* desenho do orçamento em imagem */
function wrapText(ctx,text,maxW){
  const words=String(text).split(/\s+/), lines=[]; let cur="";
  for(const w of words){ const t=cur?cur+" "+w:w; if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; }
  if(cur) lines.push(cur); return lines;
}
async function drawQuote(){
  const q=state.quote, items=quoteItems();
  const W=1080,P=64,D='"Michroma","Arial Black",sans-serif',B='"IBM Plex Sans",system-ui,Roboto,sans-serif';
  try{ await Promise.all([document.fonts.load("40px Michroma"),document.fonts.load("600 30px 'IBM Plex Sans'")]); }catch(e){}
  const logo=await loadImg(LOGO);
  const imgs=await Promise.all(items.map(x=>loadImg(photos[x.p.id])));
  const m=document.createElement("canvas").getContext("2d");
  m.font=`28px ${B}`; const obs=q.obs.trim()?wrapText(m,"Observações: "+q.obs.trim(),W-2*P):[];
  m.font=`600 34px ${B}`;
  const rows=items.map((x,i)=>{ const r=compute(x.p); return {x,r,img:imgs[i],name:wrapText(m,x.p.name||"Produto",W-2*P-200-24-260).slice(0,2)}; });
  const ROW=216;
  const H=330+190+rows.length*ROW+24+130+(obs.length?40+obs.length*40:0)+120;
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  g.fillStyle="#05070b"; g.fillRect(0,0,W,H);
  g.fillStyle="#000"; g.fillRect(0,0,W,330);
  if(logo){ const h=250,w=h*logo.width/logo.height; g.drawImage(logo,(W-w)/2,40,w,h); }
  g.fillStyle="#1e7bff"; g.fillRect(0,326,W,4);
  let y=330+78;
  g.fillStyle="#e9edf3"; g.font=`40px ${D}`; g.textBaseline="alphabetic"; g.textAlign="left"; g.fillText("ORÇAMENTO",P,y);
  const today=new Date(), until=new Date(today.getTime()+Math.max(0,num(q.days))*864e5), fd=d=>d.toLocaleDateString("pt-BR");
  g.textAlign="right"; g.font=`28px ${B}`; g.fillStyle="#8b96a8"; g.fillText("Nº "+String(state.quoteSeq).padStart(4,"0")+"  ·  "+fd(today),W-P,y);
  y+=56; g.textAlign="left"; g.fillStyle="#e9edf3"; g.font=`30px ${B}`; g.fillText("Cliente: "+(q.client.trim()||"—"),P,y);
  if(num(q.days)>0){ g.textAlign="right"; g.fillStyle="#8b96a8"; g.font=`28px ${B}`; g.fillText("Válido até "+fd(until),W-P,y); }
  y=330+190;
  rows.forEach(o=>{
    g.fillStyle="#0e1219"; g.fillRect(P-24,y,W-2*P+48,ROW-16);
    const S=152, ix=P, iy=y+24;
    if(o.img){ const k=Math.max(S/o.img.width,S/o.img.height), sw=S/k, sh=S/k; g.drawImage(o.img,(o.img.width-sw)/2,(o.img.height-sh)/2,sw,sh,ix,iy,S,S); }
    else{ g.fillStyle="#161c26"; g.fillRect(ix,iy,S,S); g.fillStyle="#8b96a8"; g.font=`56px ${D}`; g.textAlign="center"; g.fillText((o.x.p.name||"?").trim().charAt(0).toUpperCase(),ix+S/2,iy+S/2+20); }
    const tx=ix+S+28; g.textAlign="left"; g.fillStyle="#e9edf3"; g.font=`600 34px ${B}`;
    let ty=iy+38; o.name.forEach(l=>{ g.fillText(l,tx,ty); ty+=42; });
    g.fillStyle="#8b96a8"; g.font=`26px ${B}`;
    g.fillText("Peso: "+dec(o.r.grams,1)+" g",tx,ty+2); g.fillText("Tempo de produção: "+fmtTime(o.r.hours),tx,ty+38);
    g.textAlign="right"; g.fillStyle="#e9edf3"; g.font=`600 38px ${B}`; g.fillText(money(unit(o.x.p)*o.x.qty),W-P,iy+48);
    g.fillStyle="#8b96a8"; g.font=`26px ${B}`; g.fillText(o.x.qty+" × "+money(unit(o.x.p)),W-P,iy+90);
    y+=ROW;
  });
  y+=8; const total=rows.reduce((s,o)=>s+unit(o.x.p)*o.x.qty,0);
  g.fillStyle="#1e7bff"; g.beginPath(); g.moveTo(P-24,y); g.lineTo(W-P+24-34,y); g.lineTo(W-P+24,y+34); g.lineTo(W-P+24,y+114); g.lineTo(P-24,y+114); g.closePath(); g.fill();
  g.fillStyle="#fff"; g.textAlign="left"; g.font=`30px ${D}`; g.fillText("TOTAL",P,y+70);
  g.textAlign="right"; g.font=`600 52px ${B}`; g.fillText(money(total),W-P,y+76);
  y+=130+16;
  if(obs.length){ g.textAlign="left"; g.fillStyle="#c9d0da"; g.font=`28px ${B}`; y+=30; obs.forEach(l=>{ g.fillText(l,P,y); y+=40; }); }
  g.textAlign="center"; g.fillStyle="#8b96a8"; g.font=`24px ${B}`; g.fillText("Ayro Studio  ·  Impressão 3D sob encomenda",W/2,H-52);
  return c;
}

async function saveQuote(btn){

    const c=await drawQuote();

  e.preventDefault(); if(!sheetCfg) return;
  const vals={}; sheetCfg.fields.forEach(f=>vals[f.key]=$("#sh-"+f.key).value);
  const err=sheetCfg.onSave(vals);
  if(err){ toast(err); return; }
  closeSheet(); commit(); render();
});
$("#sheetBg").addEventListener("click",e=>{
  if(e.target.id==="sheetBg"){closeSheet();render();return;}
  const b=e.target.closest("[data-sh]"); if(!b) return;
  if(b.dataset.sh==="cancel"){ closeSheet(); render(); }
  else if(b.dataset.sh==="del"){
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Toque de novo para excluir"; return; }
    sheetCfg.onDelete(); closeSheet(); commit(); render();
  }
});
function filSheet(f,pick){
  openSheet({title:f?"Filamento":"Novo filamento",
    fields:[{key:"name",label:"Nome ou cor",value:f?f.name:"",text:true,ph:"Ex.: PLA Azul"},
      {key:"price",label:"Quanto paguei no rolo",value:f&&f.price>0?dec(f.price):"",pre:"R$",ph:"0,00"},
      {key:"weight",label:"Peso do rolo",value:f?dec(f.weight,0):"1000",suf:"g"},
      {key:"color",label:"Cor na lista",value:f?f.color:"#1e7bff",type:"color",text:true}],
    onSave(v){
      if(!v.name.trim()) return "Dê um nome ao filamento.";
      if(num(v.weight)<=0) return "O peso do rolo precisa ser maior que zero.";
      const o={name:v.name.trim(),color:v.color,price:Math.max(0,num(v.price)),weight:num(v.weight)};
      if(f) Object.assign(f,o); else { const n=Object.assign({id:newId()},o); state.filaments.push(n); if(pick||!state.draft.filId) state.draft.filId=n.id; }
    },
    onDelete:f?()=>{ state.filaments=state.filaments.filter(x=>x!==f); if(state.draft.filId===f.id) state.draft.filId=state.filaments[0]?.id||""; }:null,
    delLabel:"Excluir filamento"});
}
function catSheet(c,pick){
  openSheet({title:c?"Editar categoria":"Nova categoria",
    fields:[{key:"name",label:"Nome da categoria",value:c?c.name:"",text:true,ph:"Digite o nome"}],
    onSave(v){
      if(!v.name.trim()) return "Dê um nome à categoria.";
      if(c) c.name=v.name.trim(); else { const n={id:newId(),name:v.name.trim(),acc:[]}; state.categories.push(n); if(pick){ state.draft.catId=n.id; state.draft.acc={}; } }
    },
    onDelete:c?()=>{ state.categories=state.categories.filter(x=>x!==c); if(state.draft.catId===c.id){ state.draft.catId=""; state.draft.acc={}; } }:null,
    delLabel:"Excluir categoria"});
}
function accSheet(c,a){
  openSheet({title:(a?"Editar acessório de ":"Novo acessório de ")+c.name,
    fields:[{key:"name",label:"Nome",value:a?a.name:"",text:true,ph:"Ex.: Argola"},
      {key:"price",label:"Preço de cada um",value:a?dec(a.price):"",pre:"R$",ph:"0,00"},
      {key:"def",label:"Quantidade por produto",value:a?String(a.def??1):"1",suf:"un."}],
    onSave(v){
      if(!v.name.trim()) return "Dê um nome ao acessório.";
      const o={name:v.name.trim(),price:Math.max(0,num(v.price)),def:Math.max(0,Math.round(num(v.def)))};
      if(a) Object.assign(a,o); else { const n=Object.assign({id:newId()},o); c.acc.push(n); if(state.draft.catId===c.id) state.draft.acc[n.id]=n.def; }
    },
    onDelete:a?()=>{ c.acc=c.acc.filter(x=>x!==a); }:null,
    delLabel:"Excluir acessório"});
}

/* ---------- eventos ---------- */
$("#nav").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b) go(b.dataset.tab); });
$("#photoIn").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) pickPhoto(f); });
const DRAFT={"f-name":"name","f-grams":"grams","f-h":"h","f-m":"m","f-qty":"qty","f-extra":"extra","f-margin":"margin"};
const SET={"s-hour":"hour","s-margin":"margin","s-loss":"loss","s-fee":"fee"};
const QF={"q-client":"client","q-days":"days","q-obs":"obs"};
main.addEventListener("input",e=>{
  const id=e.target.id, d=state.draft;
  if(DRAFT[id]){ d[DRAFT[id]]=e.target.value; $("#result").innerHTML=resultHTML(d); saveLocal(); }
  else if(id==="f-fil"){ if(e.target.value==="__new"){ e.target.value=d.filId; filSheet(null,true); return; } d.filId=e.target.value; saveLocal(); render(); }
  else if(id==="f-cat"){ if(e.target.value==="__new"){ e.target.value=d.catId; catSheet(null,true); return; } d.catId=e.target.value; d.acc=defAcc(d.catId); saveLocal(); render(); }
  else if(SET[id]){ state.settings[SET[id]]=Math.max(0,num(e.target.value)); commit(); }
  else if(id==="srch"){ search=e.target.value; refreshPieces(); }
  else if(QF[id]){ state.quote[QF[id]]=e.target.value; saveLocal(); refreshPreview(); }
  else if(id==="q-add"){ if(e.target.value){ state.quote.items.push({id:e.target.value,qty:1}); saveLocal(); render(); } }
});
main.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=state.draft, ds=t.dataset;
  if(t.id==="delPiece"){
    if(!t.classList.contains("armed")){ t.classList.add("armed"); t.textContent="Toque de novo para excluir"; return; }
    state.pieces=state.pieces.filter(p=>p.id!==d.id); state.quote.items=state.quote.items.filter(i=>i.id!==d.id); delPhoto(d.id);
    state.draft=blankDraft(); commit(); toast("Produto excluído."); go("pieces"); return;
  }
  if(ds.step){ const q=Math.max(0,(d.acc[ds.acc]||0)+Number(ds.step)); d.acc[ds.acc]=q; $("#q-"+ds.acc).textContent=q; $("#result").innerHTML=resultHTML(d); saveLocal(); return; }
  if(ds.qstep){ const it=state.quote.items.find(i=>i.id===ds.id); if(it){ it.qty+=Number(ds.qstep); if(it.qty<=0) state.quote.items=state.quote.items.filter(i=>i!==it); saveLocal(); render(); } return; }
  if(ds.open){ const p=piece(ds.open); if(p){ if(!d.saved) delPhoto(d.id); state.draft=JSON.parse(JSON.stringify(p)); saveLocal(); go("calc"); } return; }
  if(ds.fil){ filSheet(fil(ds.fil)); return; }
  if(ds.cat){ catSheet(cat(ds.cat)); return; }
  if(ds.catAcc){ const c=cat(ds.catAcc); accSheet(c,c.acc.find(a=>a.id===ds.id)); return; }
  if(ds.addAcc){ accSheet(cat(ds.addAcc),null); return; }
  switch(ds.act){
    case "photo": $("#photoIn").click(); break;
    case "photo-del": delPhoto(d.id); render(); break;
    case "fil-price": filSheet(fil(d.filId)); break;
    case "new": if(!d.saved) delPhoto(d.id); state.draft=blankDraft(); saveLocal(); render(); main.scrollTop=0; break;
    case "new-go": if(!d.saved) delPhoto(d.id); state.draft=blankDraft(); saveLocal(); go("calc"); break;
    case "add-fil": filSheet(null); break;
    case "add-cat": catSheet(null); break;
    case "save":{
      if(!d.name.trim()){ toast("Dê um nome ao produto antes de salvar."); $("#f-name").focus(); return; }
      const copy=JSON.parse(JSON.stringify(d)); copy.name=copy.name.trim(); copy.saved=true;
      const i=state.pieces.findIndex(x=>x.id===d.id); if(i>=0) state.pieces[i]=copy; else state.pieces.push(copy);
      if(photos[copy.id]&&fotosCol) fotosCol.doc(copy.id).set({d:photos[copy.id]}).catch(()=>{});
      state.draft=blankDraft(); commit(); toast("Produto salvo."); go("pieces"); break; }
    case "to-quote":{
      if(!state.quote.items.some(i=>i.id===d.id)) state.quote.items.push({id:d.id,qty:1});
      saveLocal(); go("quote"); break; }
    case "q-save": saveQuote(t); break;
    case "backup":{
      const txt=JSON.stringify(state); const bk=$("#bk"); bk.value=txt;
      try{ navigator.clipboard.writeText(txt).then(()=>toast("Dados copiados."),()=>{bk.select();toast("Selecione o texto abaixo e copie.");}); }
      catch(err){ bk.select(); toast("Selecione o texto abaixo e copie."); }
      break; }
    case "restore":{
      try{ const o=JSON.parse($("#bk").value); if(!o||!Array.isArray(o.filaments)) throw 0; state=normalize(o); if(!state.draft||!state.draft.id) state.draft=blankDraft(); commit(); toast("Dados restaurados."); go("pieces"); }
      catch(err){ toast("Cole uma cópia válida na caixa abaixo antes de restaurar."); }
      break; }
  }
});

render();
initCloud();
})();
</script>
</body>
