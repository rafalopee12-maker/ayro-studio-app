plugins { id 'com.android.application' }

android {
    namespace 'br.com.ayrostudio.calculadora'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.ayrostudio.calculadora'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        ayro {
            storeFile file('ayro.keystore')
            storePassword 'ayrostudio'
            keyAlias 'ayro'
            keyPassword 'ayrostudio'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ayro
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
